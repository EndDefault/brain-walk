# JDK 21: match the native charset used to read Gradle 8 test-worker args files.
# This preserves Korean Windows paths (MS949) and uses UTF-8 on UTF-8 hosts.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=COMPAT
android.useAndroidX=true
kotlin.code.style=official
# The user's Windows checkout contains Korean characters. Keep that location.
android.overridePathCheck=true
