// Usage: gradlew -I tools/dependency-inventory.init.gradle :app:dependencyInventory
// Resolved versions include transitive Android app and instrumentation libraries.
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('dependencyInventory') {
        doLast {
            def rows = []
            ['debugRuntimeClasspath', 'debugAndroidTestRuntimeClasspath'].each { name ->
                app.configurations.getByName(name).resolvedConfiguration.resolvedArtifacts.each { artifact ->
                    def id = artifact.moduleVersion.id
                    rows.add("${name}\t${id.group}\t${id.name}\t${id.version}")
                }
            }
            def output = new File(gradle.rootProject.projectDir, '.artifacts/dependencies.tsv')
            output.parentFile.mkdirs()
            output.setText(rows.unique().sort().join('\n') + '\n', 'UTF-8')
            println "Resolved dependency inventory: ${output}"
        }
    }
}
